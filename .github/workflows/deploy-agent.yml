# Redeploys the Kent Pizzeria voice agent to LiveKit Cloud
# whenever something in agent/ changes on main.
# Needs three repo secrets: LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET.

name: Deploy voice agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: deploy-agent
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check LiveKit secrets match livekit.toml
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          sub=$(grep -m1 'subdomain' agent/livekit.toml | cut -d'"' -f2)
          host=$(printf '%s' "$LIVEKIT_URL" | sed -E 's#^(wss|https)://##; s#/.*##')
          [ "$host" = "$sub.livekit.cloud" ] || { echo "::error::LIVEKIT_URL does not point to $sub.livekit.cloud"; exit 1; }
          printf '%s' "$LIVEKIT_API_KEY" | grep -Eq '^API[A-Za-z0-9]+$' || { echo "::error::LIVEKIT_API_KEY has spaces, quotes or a newline, or isn't an API key"; exit 1; }
          printf '%s' "$LIVEKIT_API_SECRET" | grep -Eq '^[A-Za-z0-9]+$' || { echo "::error::LIVEKIT_API_SECRET has spaces, quotes or a newline"; exit 1; }
          echo "URL and key format OK for $sub"

      - name: Deploy LiveKit Cloud Agent
        uses: livekit/deploy-action@v2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ secrets.SECRET_LIST }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: agent
